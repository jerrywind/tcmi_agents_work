# llm_server v2 —— LM Studio 网关 + Agent 中间层。
# 模型推理由宿主机 LM Studio 提供（默认 http://localhost:11223/v1）；
# 容器通过 host.docker.internal 访问宿主机上的 LM Studio。
#
# 启动：
#   cd llm_server && docker compose up --build
# 与 harness 联调（harness 的 HARNESS_LLM_BASE_URL 指向本服务）：
#   $env:HARNESS_LLM_BASE_URL = "http://localhost:8000/v1"   （本地）
#   $env:HARNESS_LLM_BASE_URL = "http://llm_server:8000/v1"  （同一 docker 网络）
#
# 可选：通过 MCP_CLIENTS 接入外部 MCP Server（JSON 数组）：
#   $env:MCP_CLIENTS = '[{"name":"kb","url":"http://host:port/mcp","headers":{"Authorization":"Bearer xxx"}}]'

services:
  llm_server:
    build: .
    image: tcm-llm-server:local
    ports:
      - "22010:8000"           # 宿主机 22010 -> 容器 8000（业务端口区间 22000-22200）
    environment:
      LMSTUDIO_BASE_URL: "http://host.docker.internal:11223/v1"
      LMSTUDIO_API_KEY: "${LMSTUDIO_API_KEY:-sk-noauth}"
      DEFAULT_MODEL: "google/gemma-4-12b-qat"
      LLM_HOST: "0.0.0.0"
      LLM_PORT: "8000"
      ENABLE_PROMPT_OPTIMIZE: "true"
      PROMPT_MAX_CHARS: "12000"
      AGENT_MAX_ROUNDS: "8"
      ENABLE_MCP: "true"
      MCP_CLIENTS: "${MCP_CLIENTS:-[]}"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 让容器能访问宿主机上的 LM Studio
    restart: unless-stopped
