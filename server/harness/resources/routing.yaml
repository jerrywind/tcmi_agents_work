# 当前激活的诊断流程顺序（可改）
# 按顺序依次调用各 sub-agent；删除某行即跳过该步骤。
# slug 含义：
#   inspection     望诊
#   listening      闻诊
#   inquiry        问诊
#   palpation      切诊
#   differentiation 辨证
#   safety         安全门
#   treatment      治疗
active:
  - inspection
  - listening
  - inquiry
  - palpation
  - differentiation
  - safety
  - treatment

# 说明：本文件只决定「激活哪些步骤及其顺序」。
# `POST /chat` 会按 active 顺序**串行跑完全部**步骤后一次性返回，
# 没有「从某一步开始」的入口概念，因此不再保留 default 字段。
