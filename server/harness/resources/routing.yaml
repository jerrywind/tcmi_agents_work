# 当前激活的诊断流程（可改）
#
# 两种配置方式，优先用 `active_profile`：
#   1. `active_profile` —— 引用下面 `profiles` 里的命名档位（推荐）；
#   2. `active` —— 直接列出 slug 顺序（`active_profile` 为空时用它）。
# 删除某行即跳过该步骤；`safety` 不可移除（缺失会被强制补齐，见代码）。
#
# ⚠️ `safety` 的**位置不由本文件决定**：无论写在哪里，它都固定排在
#    「采集期（望闻问切）之后、辨证期之前」执行（T7.7）。
#
# 为什么：安全门曾按本文件的书写位置排在辨证之后、收敛判定之前，
# 于是信息不足以辨证时流程会停下来追问（awaiting_input），
# **安全门整个被跳过**——真实验证里「突然胸痛剧烈、出冷汗、呼吸困难、
# 左臂发麻」这条典型心梗表现因此漏检，患者反而被追问「舌苔什么颜色」。
# 安全优先于信息完整，位置不能交给配置决定。

# slug 含义：
#   采集期  inspection 望诊 / listening 闻诊 / inquiry 问诊 / palpation 切诊
#   辨证期  case_reference 医案参考 / differentiation 辨证
#   安全    safety 安全门（固定排在采集期之后，见上方说明）
#   治疗期  strategy 立法 / herbology 用药 / prescription 开方
#           care 调护 / acupuncture 针灸 / treatment 综合治疗（旧流程）
profiles:
  # 兼容档：与改造前完全一致，仅把 RAG 接进治疗步
  compatible:
    - inspection
    - listening
    - inquiry
    - palpation
    - differentiation
    - safety
    - treatment

  # 标准档（推荐）：完整的「理法方药」链路 + 医案参考，开方是最后一步
  standard:
    - inspection
    - listening
    - inquiry
    - palpation
    - case_reference
    - differentiation
    - safety
    - strategy
    - herbology
    - prescription

  # 完整档：在标准档之后追加调护与针灸
  full:
    - inspection
    - listening
    - inquiry
    - palpation
    - case_reference
    - differentiation
    - safety
    - strategy
    - herbology
    - prescription
    - care
    - acupuncture

active_profile: standard

# 直接列顺序的写法（active_profile 留空时才生效）
active: []

# 说明：harness 无状态，一次 `/chat` 按本顺序**串行跑完全部**步骤后返回，
# 没有「从某一步开始」的入口概念，因此不再保留 default 字段。
#
# 反馈式辨证：采集期四诊**并行**执行，随后辨证；若信息不足以定证，
# 流程会在辨证后停下并返回 `pending_questions`（响应 `status=awaiting_input`），
# 不会继续往下走到开方。调用方把用户回答追加进 messages 再请求一次，
# 并把 `payload.round` +1；达到上限（默认 3 轮）则强制放行并标注 `forced`。
# 若已在 `payload.syndrome` 给定证候，则跳过判定直接走完流程。
