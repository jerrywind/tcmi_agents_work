# 问诊问题库（可改）
# 每条：slug(英文索引) / prompt(向患者提问的中文文案) / category(分组) /
#       evidence_keys(命中后关联的证据关键词) / priority(优先级，越小越先问) /
#       agent(该信息该由哪个采集 agent 负责) /
#       applies_to(适用人群：any 缺省 / male / female)
# 问诊 agent 会跳过证据已收集的问题，按优先级追问。
#
# `agent` 的用途：反馈式辨证 loop 在**第二轮及以后**只跑必要的采集 agent。
# 首轮四诊全跑；后续轮若只剩「舌苔什么颜色」这类问题，就只跑望诊，
# 不必把闻诊、切诊再走一遍。取值必须是 routing 里的采集类 slug
# （inspection / listening / inquiry / palpation）。
#
# 排序原则：**舌象与脉象优先**。证候打分里舌脉与症状同级命中（各 +1），
# 而患者主诉极少主动交代舌脉，不问就永远拿不到——这两项往往正是
# 寒热、虚实鉴别的关键。

- slug: tongue
  prompt: 方便看一下舌象吗？舌质颜色偏淡、偏红还是暗？舌苔是薄白、薄黄、厚腻还是少苔？
  category: 舌象
  evidence_keys: ["舌苔", "苔薄白", "苔薄黄", "苔白腻", "黄腻苔", "少苔", "舌淡", "舌红"]
  priority: 1
  agent: inspection

- slug: fever
  prompt: 您有没有发烧？体温大概多少？怕冷还是怕热？
  category: 寒热
  evidence_keys: ["恶寒", "发热", "怕冷", "怕热"]
  priority: 3
  agent: inquiry

- slug: sweat
  prompt: 出汗多吗？是白天动则汗出，还是夜间睡着后出汗？
  category: 汗出
  evidence_keys: ["汗出", "自汗", "盗汗", "无汗"]
  priority: 4
  agent: inquiry

- slug: head_body
  prompt: 头身有没有酸痛、沉重或胀痛的感觉？
  category: 头身
  evidence_keys: ["头痛", "身痛", "身重", "头晕"]
  priority: 5
  agent: inquiry

- slug: stool_urine
  prompt: 大便和小便情况怎么样？大便干稀、次数，小便颜色？
  category: 二便
  evidence_keys: ["便溏", "便秘", "小便黄", "小便清长"]
  priority: 6
  agent: inquiry

- slug: appetite
  prompt: 胃口怎么样？有没有腹胀、恶心？
  category: 饮食
  evidence_keys: ["纳呆", "脘腹胀满", "恶心", "纳差"]
  priority: 7
  agent: inquiry

- slug: sleep
  prompt: 睡眠好吗？有没有失眠、多梦、易醒？
  category: 睡眠
  evidence_keys: ["失眠", "多梦", "心悸", "嗜睡"]
  priority: 8
  agent: inquiry

- slug: emotion
  prompt: 最近情绪如何？容易生气、抑郁或焦虑吗？
  category: 情志
  evidence_keys: ["情志抑郁", "善太息", "烦躁", "焦虑"]
  priority: 9
  agent: inquiry

- slug: menstruation
  prompt: 月经是否规律？有无痛经、色量异常？
  category: 经带
  evidence_keys: ["月经不调", "痛经", "经量少", "经量多"]
  priority: 10
  agent: inquiry
  # 只问女性：此前靠 prompt 里写「若是女性」让模型自己判断，
  # 模型照抄文案后男患者也会被追问月经（人工验收点名）。
  applies_to: female

- slug: voice
  prompt: 说话声音是洪亮还是低微？咳嗽声重浊还是清脆？有没有异常气味？
  category: 声音气味
  evidence_keys: ["语声", "声音", "声重", "声低", "咳嗽声", "口臭", "口气"]
  priority: 11
  agent: listening

- slug: complexion
  prompt: 面色如何？偏白、偏黄、潮红还是晦暗？精神状态怎么样？
  category: 神色形态
  evidence_keys: ["面色", "萎黄", "潮红", "苍白", "晦暗", "神疲"]
  priority: 12
  agent: inspection
