# 证候库（可改）
# 每条证候：slug(英文索引) / name(中文名) / meridian(脏腑经络) /
#           key_symptoms(主症) / minor_symptoms(次症) /
#           tongue(舌象) / pulse(脉象) / pathogenesis(病机) /
#           principles(治则，立法 agent 的依据)
#
# ## H2：症状为什么分两级
#
# 中医辨证讲「主症必备」——次症凑得再多，缺了主症也不该定证。
# 不分级的后果是「乏力」「纳呆」「失眠」这类跨证候的非特异表现
# 与「恶寒重发热轻」「脉浮紧」这类强特异表现同权计数，于是
# **症状表越长的证候越容易赢**，凑次症就能压过命中主症；
# 库外的证候（如肾阳虚）会被判成库内最像的那一个，而且看起来有置信度。
#
# 打分权重见 `src/agents/differentiation.rs`：主症 1.0 / 次症 0.4 /
# 舌象 1.0 / 脉象 1.0 / 关键词证据 0.5（且只计症状表之外的线索）。
#
# ## 编写约束
#
# 1. **主症/次症里不要写舌象与脉象**——舌脉由 `tongue` / `pulse` 字段负责，
#    写进症状会与舌脉字段重复计分（同一表现算两遍）；
# 2. `key_symptoms` 取 3~5 条最能定证的表现，且尽量是**本证特有**的：
#    与相近证候共有的泛化表现（乏力、纳差、失眠）放进次症；
# 3. 主症之间应能互相印证、同向，不要把「或然」表现写进主症；
# 4. slug 被 keywords.yaml / formulas.yaml / care.yaml 引用，请勿随意改动已引用的 slug。
#
# ⚠️ 症状、舌脉、病机、治则须由执业中医师复核：本库用于**约束模型输出**，
#    写错等于把错误固化下来。

