# 关键词证据映射（可改）
# 每条：slug(英文索引) / label(中文标签) / keywords(触发关键词) /
#       syndromes(指向的证候 slug) / note(说明)
# 四诊 agent 命中关键词即叠加证据，辨证 agent 据此初筛证候。

- slug: wind_cold
  label: 风寒证据
  keywords: ["恶寒", "恶寒重发热轻", "无汗", "清涕", "白痰", "身痛", "头痛", "浮紧", "流清涕", "鼻塞"]
  syndromes: ["wind_cold_attack_lung"]
  note: 风寒表实之象

- slug: wind_heat
  label: 风热证据
  keywords: ["咽痛", "黄涕", "黄痰", "口渴", "恶风", "浮数"]
  syndromes: ["wind_heat_attack_lung"]
  note: 风热表热之象

- slug: damp_spleen
