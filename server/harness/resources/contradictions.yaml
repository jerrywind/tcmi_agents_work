# 相反表现对照表（可改）
# 每条：slug(英文索引) / a、b(互斥的两种表现) / note(说明)
#
# 用途：辨证时若某证候的症状被命中，而语料中同时出现了它的**相反表现**，
#       该相反表现即作为「矛盾证据」计入，扣减该证候的证据量（见 T4.1）。
#
# 编写约束（很重要）：
# 1. a 与 b 之间**不得有子串包含关系**，否则同一个词会互相都算命中
#    （例如「便溏」是「大便溏黏」的子串，这种对子不能写在这里）；
# 2. 用证候库（syndromes.yaml）里出现的**原词**，否则匹配不上；
# 3. 判定是双向的：命中 a 且语料出现 b，或命中 b 且语料出现 a，都算矛盾。

- slug: sweat
  a: 无汗
  b: 有汗
  note: 表实无汗与表虚有汗不可并见

- slug: nasal_discharge
  a: 流清涕
  b: 流黄涕
  note: 清涕属寒、黄涕属热

- slug: sputum
  a: 痰白稀
  b: 痰黄稠
  note: 白稀属寒、黄稠属热

- slug: chills_vs_wind
  a: 恶寒重发热轻
  b: 微恶风
  note: 恶寒重为表寒、微恶风为表热

- slug: pulse_floating
  a: 脉浮紧
  b: 脉浮数
  note: 浮紧主寒、浮数主热

- slug: pulse_damp
  a: 脉濡缓
  b: 脉滑数
  note: 濡缓主湿困、滑数主湿热

- slug: tongue_body
  a: 舌淡红
  b: 舌尖红
  note: 舌尖红为风热初起之象

- slug: tongue_coat
  a: 苔薄白
  b: 苔黄腻
  note: 薄白主表寒、黄腻主湿热

- slug: tongue_coat_thin
  a: 苔薄白
  b: 苔薄黄
  note: 薄白主寒、薄黄主热
