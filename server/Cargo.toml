[workspace]
resolver = "2"
members = [
    "rrserver",
    "harness",
]

# 工作区统一依赖版本，避免各 crate 重复声明
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
# `stream` 用于消费上游 LLM 的 SSE 分片（token 级流式）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

# 发布档优化：镜像里的二进制瘦身（只影响 `cargo build --release`，
# 日常测试走 dev 档、不在此处，测试时长与行为均不受影响）。
[profile.release]
# 剥离符号表：无 debug 信息可留时，符号表是二进制的常见大头之一
strip = "symbols"
# 跨 crate 薄 LTO：链路级删除未用代码并共享内联，进一步压缩并略提性能
lto = "thin"
