# 单独启动 rrserver（中继）的开发 / 调试编排。
#
# 注意：镜像用的是**统一后端镜像 tcmi_server** server/Dockerfile（内含 harness + rrserver
# 两个二进制）。默认 entrypoint 会同时拉起两个进程，这里用 command 指定只跑 rrserver
# 的某个子命令，故 healthcheck（探 43301 + 43302）对这几个服务不适用，已禁用。
#
# 生产编排：rrserver 已合并进 deploy/docker-compose.yml 的 tcmi_server 容器（同容器 43302）。
# nginx 反代 / TLS 在仓库根 deploy/ 目录（deploy/nginx/rrserver.conf）。
# 本文件仍可用于单独启动 rrserver（开发 / 调试），但需自行解决对外暴露与 TLS。
services:
  rrserver:
    # 上下文必须是 workspace 根（server/）：统一 Dockerfile 位于 server/Dockerfile，
    # 两个 crate 共享编译缓存。上下文裁剪见 server/.dockerignore。
    build:
      context: ..
      dockerfile: Dockerfile
    image: tcmi_server:local
    restart: unless-stopped
    # 容器内监听 0.0.0.0:43302，供同网络下的 nginx 访问（默认 127.0.0.1 仅本容器回环，nginx 无法连通）。
    # 镜像本身以非 root 用户（uid 10001）运行。
    command: ["rrserver", "server", "--listen", "0.0.0.0:43302", "--config", "/etc/rrserver.toml"]
    healthcheck:
      disable: true
    volumes:
      - ./config/rrserver.toml:/etc/rrserver.toml:ro

  # ── 以下为可选服务，放在 optional profile 下，默认 `docker compose up` 不会启动 ──
  # 运行方式：docker compose --profile optional up -d [client|llm-server]

  # 家庭端隧道客户端：主动把本地 llm 注册到云端（无需开放任何端口）。
  # --local 指向宿主上的模型服务（用 host.docker.internal 访问宿主网络）。
  client:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tcmi_server:local
    restart: unless-stopped
    profiles: ["optional"]
    healthcheck:
      disable: true
    command:
      - "rrserver"
      - "client"
      - "--server"
      - "https://<你的域名>/rr"
      - "--name"
      - "home"
      - "--token"
      - "${HOME_TUNNEL_TOKEN:-change-me}"
      - "--local"
      - "http://host.docker.internal:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 模型部署包装：拉起本地模型服务并注册到云端隧道（deploy + 注册一键完成）。
  # 需先准备 config/llm_server.toml（参考 config/llm_server.toml.example）。
  llm-server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tcmi_server:local
    restart: unless-stopped
    profiles: ["optional"]
    healthcheck:
      disable: true
    command: ["rrserver", "llm-server", "--config", "/etc/llm_server.toml"]
    volumes:
      - ./config/llm_server.toml:/etc/llm_server.toml:ro
    # 若 tcmi_server 为 command 模式需在容器内访问宿主 GPU / 模型目录，按需追加 devices / volumes。
