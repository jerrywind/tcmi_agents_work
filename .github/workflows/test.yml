name: Test

on:
  push:
    branches: [main, master, dev]
  pull_request:

# 同一分支/PR 的多次推送只保留最新一次运行，避免资源浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 后端**完全依赖 Docker** 构建与验证：编译、测试、lint 一律在容器内完成，
  # 不使用 runner 本地的 cargo 产物，也不预编译二进制。
  RUST_IMAGE: rust:1.98-bookworm
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  backend-test:
    name: 后端测试（Docker 内编译执行）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: cargo test --workspace
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/server:/build" -w /build "$RUST_IMAGE" \
            cargo test --workspace --verbose

  backend-lint:
    name: 后端 lint（fmt + clippy，Docker 内）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: cargo fmt --check && clippy -D warnings
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/server:/build" -w /build "$RUST_IMAGE" \
            bash -c "rustup component add rustfmt clippy && \
                     cargo fmt --all -- --check && \
                     cargo clippy --workspace --all-targets -- -D warnings"

  backend-image:
    name: 后端镜像构建（多阶段，镜像内编译）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        crate: [harness, rrserver]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker build ${{ matrix.crate }}
        # 构建上下文必须是 workspace 根（server/）：两个 crate 共享 target/，
        # 且 harness 依赖 rrserver 的 lib。
        run: |
          cd server
          docker build -f ${{ matrix.crate }}/Dockerfile -t tcm-${{ matrix.crate }}:ci .

  frontend:
    name: 前端单元（vitest）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Run vitest
        # 契约测试会在后端不可达时自动 skip，故无需起后端即可绿灯。
        run: npm run test

  frontend-contract:
    name: 前端 ↔ harness 契约（真实后端）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build harness image
        run: cd server && docker build -f harness/Dockerfile -t tcm-harness:ci .
      - name: Run harness (只读端点无需 LLM)
        run: docker run -d --name harness -p 8011:8011 tcm-harness:ci
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8011/health && break
            sleep 1
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: cd frontend && npm ci
      - name: Run contract test against live harness
        run: cd frontend && npx vitest run src/services/harness.contract.test.ts
      - name: Tear down
        if: always()
        run: docker rm -f harness
