# 云端部署：rrserver（中继） + nginx（反代/TLS）。
# rrserver 不暴露宿主机端口，只通过内部网络给 nginx 访问；证书放在 ./certs。
services:
  rrserver:
    build: .
    restart: unless-stopped
    # 容器内监听 0.0.0.0:8080，供同网络下的 nginx 访问（默认 127.0.0.1 仅本容器回环，nginx 无法连通）。
    # 镜像本身以非 root 用户（uid 10001）运行。
    command: ["server", "--listen", "0.0.0.0:8080", "--config", "/etc/rrserver.toml"]
    volumes:
      - ./config/rrserver.toml:/etc/rrserver.toml:ro
    ports:
      # 宿主机端口固定在 22000-22200 业务端口区间
      - "22001:8080"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot:/var/www/certbot:ro
    depends_on:
      - rrserver

  # ── 以下为可选服务，放在 optional profile 下，默认 `docker compose up` 不会启动 ──
  # 运行方式：docker compose --profile optional up -d [client|llm-server]

  # 家庭端隧道客户端：主动把本地 llm 注册到云端（无需开放任何端口）。
  # --local 指向宿主上的模型服务（用 host.docker.internal 访问宿主网络）。
  client:
    build: .
    restart: unless-stopped
    profiles: ["optional"]
    command:
      - "client"
      - "--server"
      - "https://<你的域名>/rr"
      - "--name"
      - "home"
      - "--token"
      - "${HOME_TUNNEL_TOKEN:-change-me}"
      - "--local"
      - "http://host.docker.internal:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 模型部署包装：拉起本地模型服务并注册到云端隧道（deploy + 注册一键完成）。
  # 需先准备 config/llm_server.toml（参考 config/llm_server.toml.example）。
  llm-server:
    build: .
    restart: unless-stopped
    profiles: ["optional"]
    command: ["llm-server", "--config", "/etc/llm_server.toml"]
    volumes:
      - ./config/llm_server.toml:/etc/llm_server.toml:ro
    # 若 backend 为 command 模式需在容器内访问宿主 GPU / 模型目录，按需追加 devices / volumes。
