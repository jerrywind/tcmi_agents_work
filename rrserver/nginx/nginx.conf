# rrserver 云端反代配置（挂载为 /etc/nginx/conf.d/default.conf）
#
# 拓扑：公网 -> nginx(:443 TLS) -> rrserver(:8080, 仅容器内网络)
# 路径约定：外部统一走 https://<域名>/rr/... ，nginx 去掉 /rr 前缀转发到 rrserver。
#   /rr/api/register  -> rrserver /api/register
#   /rr/ws/<name>     -> rrserver /ws/<name>      （WebSocket 隧道）
#   /rr/t/<name>/...  -> rrserver /t/<name>/...    （外部访问家庭端 llm）

# WebSocket 连接头映射（家庭端隧道是长连接，需 Upgrade）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 证书申请（ACME）验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余 HTTP 一律跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 隧道是长连接，关闭读写超时避免被 nginx 提前断开（需与 rrserver 的 600s 超时对应）
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location /rr/ {
        # 去掉 /rr 前缀后再转发到 rrserver
        rewrite ^/rr/(.*)$ /$1 break;
        proxy_pass http://rrserver:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级（家庭端隧道用）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
