# backend 接入本地大模型时的环境变量覆盖，仅在与 backend/docker-compose.yml
# 一起加载时生效。模型由宿主机 LM Studio 提供，llm_server/ 为网关 + Agent 中间层。
#
# 用法（在 backend/ 目录）:
#   docker compose -f docker-compose.yml -f docker-compose.llm.yml --profile llm up --build
#
# 默认（不加载本文件）backend 仍为离线 rule 实现，无需任何模型权重。
# 需将 backend 与 llm_server 加入同一 docker 网络，backend 才能解析
# http://llm_server:8000。
#
# 前置条件：宿主机已启动 LM Studio（http://localhost:11223/v1）并加载
# google/gemma-4-12b-qat（多模态，文本/视觉共用）。llm_server 容器通过
# host.docker.internal 访问宿主机 LM Studio。

services:
  backend:
    environment:
      TCM_LLM_BASE_URL: "http://llm_server:8000/v1"
      TCM_LLM_API_KEY: "${TCM_LLM_API_KEY:-sk-noauth}"
      TCM_LLM_TEXT_MODEL: "google/gemma-4-12b-qat"
      TCM_LLM_VISION_MODEL: "google/gemma-4-12b-qat"
      # 视觉与文本共用同一网关端点（gemma-4-12b-qat 原生多模态）
      TCM_LLM_VISION_BASE_URL: "http://llm_server:8000/v1"
      # RAG 为可选独立组件：如单独启动 rag/ 服务，请取消注释并指向其地址
      # TCM_RAG_BASE_URL: "http://rag:9000"
      TCM_ROUTING_FILE: "/app/routing.llm.yaml"
