# 前端入口（由 deploy/docker-compose.yml 的 nginx 服务挂载，监听 8080）。
# 静态产物通过 bind mount 挂载到 /usr/share/nginx/html（即 frontend/dist）。
# 反向代理 /api 到同网络下的 harness 服务（Rust 后端）。

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端 SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理（前端 apiBase 为相对路径 /api）
    # harness 的端点无 /api 前缀（/chat、/agents、/skills、/health、/reload），
    # 故此处以带 URI 的 proxy_pass 剥离 /api 前缀后再转发。
    location /api/ {
        proxy_pass http://harness:8011/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 注：原 backend 的 /uploads 静态目录在 harness 中已不存在
    # （harness 不落盘图片，图片以 base64 / URL 随请求传入），故不再反代该路径，
    # 避免产生必然 404 的转发。若将来接入对象存储，在此新增对应 location 即可。
}
